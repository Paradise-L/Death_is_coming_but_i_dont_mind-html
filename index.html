<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Death is coming, but I don't mind.</title>
    <style>
        html, body{
            overflow: hidden;
            background: linear-gradient(to top, rgb(17, 17, 19),rgb(26, 26, 30));
            background-repeat: no-repeat ;
            background-attachment: fixed ;
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        .main-wrapper{
            display: grid;
            place-items: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        .interface{
            width: 100%;
            max-width: 1280px;
            padding: 10px;
            box-sizing: border-box;
        }

        .menu-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .full_screen{
            color: rgb(123, 123, 142);
            font-size: 18px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: rgb(26, 26, 28);
            border-radius: 15.5px;
            padding: 11px 17.5px;
            border: 3px rgb(74, 74, 86) solid;
            cursor: pointer;
            top: -5px;
            left: 20px;
            display:flex;
            position: absolute;
            z-index: 999;
        }
        img{
            display: block;
            margin: -75px auto -75px auto;
        }
        button{
            color: rgb(255, 255, 255);
            font-size: 23px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background-color: rgb(26, 26, 28);
            border-radius: 15px;
            padding: 12px 35px;
            border: 3px rgb(255, 255, 255) solid;
            cursor: pointer;
            display: block;
            margin: 33px auto;
        }
        p{
            color: rgb(85, 85, 100);
            font-size: 12px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            position: fixed;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        h2{
            color: white;
            font-size: 18px;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            display: block;
            text-align: center;
        }

        button:hover{
            transform: scale(1.02);
        }
        .startMenu.slide-down{
            animation: smoothStretchAndShot 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes smoothStretchAndShot {
      0% {
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateX(-46vh);
        opacity: 0.5;
        filter: blur(3px);
      }
    }
    .aboutTheGame{
        opacity: 0;
        margin: -325px auto -320px auto;
        visibility: hidden;
    }

    .aboutTheGame.slider-up{
        animation: smoothAboutTheGame 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes smoothAboutTheGame{
    0%{
        visibility: visible;
        transform: translateX(110vh);
        opacity: 0;
        filter: blur(3px);
    }
    100% {
        transform: translateX(45vh);
        opacity: 1;
        filter: blur(0px);
        visibility: visible;
    }
    }

    .startMenu.slide-up{
        animation: smoothStretchAndShotBack 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes smoothStretchAndShotBack {
      0% {
        transform: translateX(-46vh);
        opacity: 0.5;
        filter: blur(3px);
      }
      100% {
        transform: translateX(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    .aboutTheGame.slider-down{
        animation: smoothAboutTheGameBack 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes smoothAboutTheGameBack{
    0%{
        visibility: visible;
        transform: translateX(45vh);
        opacity: 1;
        filter: blur(0px);
    }
    100% {
        transform: translateX(110vh);
        opacity: 0;
        filter: blur(3px);
        visibility: hidden;
    }
    }

    .choiceChapter{
        display: flex;
        opacity: 0;
        gap: 20px;
        margin: 40px auto;
        visibility: hidden;
        flex-direction: column;
        align-items: center;
    }

    .choiceChapter h2{
        margin: -20px;
    }

    .buttonsRow{
        display: flex;
        flex-direction: row;
        gap: 10px;
        justify-content: center;
        margin: 0 auto -50px auto
    }

    .choiceChapter.slider-up{
        animation: smoothChoiceChapter 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes smoothChoiceChapter{
    0%{
        visibility: visible;
        transform: translateX(110vh);
        opacity: 0;
        filter: blur(3px);
    }
    100% {
        transform: translateX(45vh);
        opacity: 1;
        filter: blur(0px);
        visibility: visible;
    }
    }

    .choiceChapter.slider-down{
        animation: smoothChoiceChapterBack 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes smoothChoiceChapterBack{
    0%{
        visibility: visible;
        transform: translateX(45vh);
        opacity: 1;
        filter: blur(0px);
    }
    100% {
        transform: translateX(110vh);
        opacity: 0;
        filter: blur(3px);
        visibility: hidden;
    }
    }

    .choiceChapterButton{
    display: inline-block;
    font-size: 25px;
    padding: 12px 20px;
    flex-direction: row;
    margin: 25px 5px;
    }

    </style>
</head>

<body class="main-wrapper">
    <p>© Paradise-L</p>
    <p style="left: 98%">2026</p>

    <div class="interface">
    <button class="full_screen">⛶</button>
        <div class = menu-content>
        <div class="startMenu" id="menu">
            <img src="./sprites/IMG_6148.png" alt="Death is coming, but i don't mind" width="700px">
            <button onclick="startGame()">Новая игра</button>
            <button onclick="animateChoiceChapter()">Выбор главы</button>
            <button onclick="animateATG()">Об игре</button>
        </div>

        <div class="aboutTheGame" id="ATG">
            <h2>Визуальная новелла про очень приятную смерть,<br>в чулках, мини-юбке, а может, и без неё...<br><br>Управление с помощью кнопок 
                на экране, а также:<br> следующий кадр - пробел или Enter или стрелочка вправо, <br> прошлый кадр - стрелочка влево</h2> 
            <h2>Игра создана в 2026 году</h2>
            <button onclick="animateMenu()">Назад</button>
        </div>

        <div class="choiceChapter" id="cC">
            <h2>Выберите главу пожалуйста</h2>
            <div class="buttonsRow">
                <button class="choiceChapterButton">1</button>
                <button class="choiceChapterButton">2</button>
                <button class="choiceChapterButton">3</button>
            </div>
        <button onclick="animateMenuCC()">Назад</button>
    </div>
    </div>
    </div>
</body>

<script>
const btnflscr = document.querySelector(".full_screen")
let firstTap0 = true
let firstTap1 = true

btnflscr.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
      btnflscr.textContent = "◀";
    } else {
      await document.exitFullscreen();
      btnflscr.textContent = "⛶";
    }
  } catch (error) {
    console.log("Ошибка:", error);
  }
});

function animateATG(){
    const menu = document.getElementById("menu")
    const ATG = document.getElementById("ATG")
    menu.classList.add("slide-down")
    ATG.classList.add("slider-up")
    menu.classList.remove('slide-up')
    ATG.classList.remove('slider-down')
    if (firstTap0 == false){
        const choiceChapter = document.getElementById("cC")
        choiceChapter.classList.add("slider-down")
        choiceChapter.classList.remove("slider-up")
    }
    firstTap0 = true
    firstTap1 = false
}

function animateMenu(){
    const menu = document.getElementById("menu")
    const ATG = document.getElementById("ATG")
    menu.classList.add("slide-up")
    ATG.classList.add("slider-down")
    menu.classList.remove('slide-down')
    ATG.classList.remove('slider-up')
    firstTap0 = true
}

function animateMenuCC(){
    const menu = document.getElementById("menu")
    const choiceChapter = document.getElementById("cC")
    menu.classList.add("slide-up")
    choiceChapter.classList.add("slider-down")
    menu.classList.remove('slide-down')
    choiceChapter.classList.remove("slider-up")
    firstTap1 = true
}

function animateChoiceChapter(){
    const menu = document.getElementById("menu")
    const choiceChapter = document.getElementById("cC")
    menu.classList.add("slide-down")
    choiceChapter.classList.add("slider-up")
    menu.classList.remove('slide-up')
    choiceChapter.classList.remove("slider-down")
    if (firstTap1 == false){
        const ATG = document.getElementById("ATG")
        ATG.classList.add("slider-down")
        ATG.classList.remove('slider-up')
    }
    firstTap1 = true
    firstTap0 = false
}

function startGame(){
    window.location.href = "game.html"
}

</script>
</html>
